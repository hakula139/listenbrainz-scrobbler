name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  workflow_dispatch:
    inputs:
      notes:
        description: >-
          Tag whose release notes to republish from this ref's CHANGELOG.md
          (leave empty on a tag to publish its release)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagged-ci:
    name: Check Tagged Commit CI
    if: ${{ github.ref_type == 'tag' && !inputs.notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull request runs test a merge commit, so only push and dispatched runs count.
          while true; do
            verdict=$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
                --paginate \
                --slurp |
                jq -r '[.[].workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]
                  | if any(.[]; .conclusion == "success") then
                      "passed \(map(select(.conclusion == "success"))[0].html_url)"
                    elif any(.[]; .status != "completed") then "running"
                    else "failed" end'
            )
            case "$verdict" in
              passed*)
                echo "CI passed on $GITHUB_SHA: ${verdict#passed }"
                exit 0
                ;;
              running)
                sleep 30
                ;;
              *)
                echo "::error::No push or dispatched CI run passed on $GITHUB_SHA." \
                  "Rerun its failed jobs, or run ci.yml on $GITHUB_REF_NAME, then rerun this job."
                exit 1
                ;;
            esac
          done

  publish:
    name: Publish GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    needs: tagged-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the package version
        shell: bash
        run: |
          version=$(
            python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )
          if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build Python distributions
        run: nix develop -c uv build

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parse-changelog CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md

          options=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS "${options[@]}"

  publish-pypi:
    name: Publish to PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/listenbrainz-scrobbler/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
          enable-cache: false

      - name: Download released distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS -- "$GITHUB_REF_NAME"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  notes:
    name: Republish Release Notes
    if: ${{ inputs.notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Republish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.notes }}
        run: |
          parse-changelog CHANGELOG.md "${TAG#v}" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
