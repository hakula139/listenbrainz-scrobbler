name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  workflow_dispatch:
    inputs:
      notes:
        description: >-
          Tag whose release notes to republish from this ref's CHANGELOG.md
          (leave empty on a tag to publish its release)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagged-ci:
    name: Check Tagged Commit CI
    if: ${{ github.ref_type == 'tag' && !inputs.notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for CI on the tagged commit
        uses: hakula139/devkit/.github/actions/tagged-ci@v1

  publish:
    name: Publish GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    needs: tagged-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the package version
        shell: bash
        run: |
          version=$(
            python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )
          if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi

      - name: Setup Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v1

      - name: Build Python distributions
        run: nix develop -c uv build

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - name: Publish release
        uses: hakula139/devkit/.github/actions/publish-release@v1
        with:
          assets: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-pypi:
    name: Publish to PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/listenbrainz-scrobbler/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.13'
          enable-cache: false

      - name: Download released distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS -- "$GITHUB_REF_NAME"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  notes:
    name: Republish Release Notes
    if: ${{ inputs.notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Republish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.notes }}
        run: |
          parse-changelog CHANGELOG.md "${TAG#v}" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
