name: Release

on:
  push:
    tags: ['v[0-9]+.*']
  workflow_dispatch:
    inputs:
      notes:
        description: >-
          Tag whose release notes to republish from this ref's CHANGELOG.md
          (leave empty on a tag to publish its release)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tagged-ci:
    name: Check Release
    if: ${{ github.ref_type == 'tag' && !inputs.notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the package version
        run: |
          version=$(
            python3 -c \
              'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])' \
              < pyproject.toml
          )
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi

      - name: Wait for CI on the tagged commit
        uses: hakula139/devkit/.github/actions/tagged-ci@v3

  publish:
    name: Publish GitHub Release
    needs: tagged-ci
    outputs:
      wheel: ${{ steps.assets.outputs.wheel }}
      sdist: ${{ steps.assets.outputs.sdist }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Python distributions
        run: nix develop --print-build-logs -c uv build

      - name: Generate checksums
        id: assets
        run: |
          version=$(nix develop -c uv version --short --no-sync)
          wheel="listenbrainz_scrobbler-${version}-py3-none-any.whl"
          sdist="listenbrainz_scrobbler-${version}.tar.gz"
          cd dist
          sha256sum "$wheel" "$sdist" > SHA256SUMS
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "sdist=$sdist" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: hakula139/devkit/.github/actions/publish-release@v3
        with:
          assets: |
            dist/${{ steps.assets.outputs.wheel }}
            dist/${{ steps.assets.outputs.sdist }}
            dist/SHA256SUMS

  publish-pypi:
    name: Publish to PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/listenbrainz-scrobbler/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '>=0.13'
          enable-cache: false

      - name: Download released distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHEEL: ${{ needs.publish.outputs.wheel }}
          SDIST: ${{ needs.publish.outputs.sdist }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern "$WHEEL" \
            --pattern "$SDIST" \
            --pattern SHA256SUMS

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  notes:
    name: Republish Release Notes
    if: ${{ inputs.notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install changelog parser
        uses: taiki-e/install-action@parse-changelog

      - name: Republish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.notes }}
        run: |
          parse-changelog CHANGELOG.md "${TAG#v}" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
