[changelog]
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | split(pat="-->") | last | trim }}

    {% for commit in commits -%}
        - {% if commit.scope %}_({{ commit.scope }})_ {% endif -%}
          {{ commit.message | upper_first | trim }}{% if commit.breaking_description %}: {{ commit.breaking_description | trim }}{% endif %}
    {% endfor %}
{%- endfor -%}
"""
trim = true
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"

# Keep all commits in the draft so editorial review can recover mislabeled changes.
commit_parsers = [
  { message = '^[a-z]+(\([^)]+\))?!:', group = "<!-- 0 -->Breaking changes" },
  { message = '(?m)^BREAKING[ -]CHANGE:', group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Changed" },
  { message = ".*", group = "<!-- 4 -->Review" },
]
