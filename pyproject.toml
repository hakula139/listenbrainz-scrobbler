[project]
name = "listenbrainz-scrobbler"
version = "0.1.0"
description = "A background Apple Music scrobbler for ListenBrainz on macOS"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "keyring>=25"]

[project.scripts]
lb-scrobbler = "lb_scrobbler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lb_scrobbler"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8",
    "pre-commit>=4.6.2",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
