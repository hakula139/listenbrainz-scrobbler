[project]
name = "listenbrainz-scrobbler"
version = "0.3.0"
description = "A background Apple Music scrobbler for ListenBrainz on macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["httpx>=0.28.1", "keyring>=25.7.0"]

[project.urls]
Repository = "https://github.com/hakula139/listenbrainz-scrobbler"
Issues = "https://github.com/hakula139/listenbrainz-scrobbler/issues"

[project.scripts]
lb-scrobbler = "lb_scrobbler.cli:main"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lb_scrobbler"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "pyproject.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["mypy>=2.4.1", "packaging>=26.3", "pytest>=9.2.0"]

[tool.uv]
required-version = ">=0.13"
python-downloads = "never"
python-preference = "only-system"

[tool.ruff]
src = ["src"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "S", "SIM", "UP", "W"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]
untyped_calls_exclude = ["keyring.backends.macOS"]
